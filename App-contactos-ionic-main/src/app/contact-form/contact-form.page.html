<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Editar Contacto' : 'Nuevo Contacto' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input [(ngModel)]="contact.name"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Apellido</ion-label>
    <ion-input [(ngModel)]="contact.apellido"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Teléfono</ion-label>
    <ion-input [(ngModel)]="contact.phone" type="tel"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Email (opcional)</ion-label>
    <ion-input [(ngModel)]="contact.email" type="email"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Nota (opcional)</ion-label>
    <ion-input [(ngModel)]="contact.nota"></ion-input>
  </ion-item>
  <ion-button expand="block" (click)="save()">Guardar</ion-button>
</ion-content>

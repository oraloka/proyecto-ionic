<ion-header [translucent]="true" class="professional-header">
  <ion-toolbar class="toolbar-modern">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="professional-login" [fullscreen]="true">
  <!-- Redesigned login layout with centered, symmetric design -->
  <div class="login-container">
    <!-- Logo Section - Centered -->
    <div class="logo-section">
      <div class="logo-circle">
        <ion-icon name="key"></ion-icon>
      </div>
      <h1 class="app-title">YourApp</h1>
      <p class="subtitle">Bienvenido de vuelta</p>
    </div>

    <!-- Login Form - Centered -->
    <form (ngSubmit)="onLogin()" class="login-form">
      <!-- Email Input -->
      <div class="form-group">
        <ion-item class="modern-input">
          <ion-icon slot="start" name="mail"></ion-icon>
          <ion-input 
            type="email" 
            placeholder="Correo electrónico"
            [(ngModel)]="email" 
            name="email" 
            required>
          </ion-input>
        </ion-item>
        <div class="error-message" *ngIf="email && !isValidEmail()">
          Ingresa un correo válido
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <ion-item class="modern-input">
          <ion-icon slot="start" name="lock-closed"></ion-icon>
          <ion-input 
            type="password" 
            placeholder="Contraseña"
            [(ngModel)]="password" 
            name="password" 
            required>
          </ion-input>
        </ion-item>
        <div class="forgot-password">
          <ion-button 
            fill="clear" 
            size="small"
            routerLink="/forgot-password">
            ¿Olvidaste tu contraseña?
          </ion-button>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="remember-section">
        <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe"></ion-checkbox>
        <span class="remember-text">Recuérdame</span>
      </div>

      <!-- Login Button -->
      <ion-button 
        expand="block" 
        type="submit" 
        class="login-button"
        [disabled]="!email || !password">
        <span class="button-text">Entrar</span>
        <ion-icon slot="end" name="arrow-forward"></ion-icon>
      </ion-button>

      <!-- Divider -->
      <div class="divider-section">
        <div class="divider-line"></div>
        <span class="divider-text">O continúa con</span>
        <div class="divider-line"></div>
      </div>

      <!-- Social Login - Centered -->
      <div class="social-buttons">
        <ion-button 
          expand="block" 
          class="social-button google-button"
          (click)="onLoginWithGoogle()">
          <ion-icon slot="start" name="logo-google"></ion-icon>
          Google
        </ion-button>
        <ion-button 
          expand="block" 
          class="social-button apple-button"
          (click)="onLoginWithApple()">
          <ion-icon slot="start" name="logo-apple"></ion-icon>
          Apple
        </ion-button>
      </div>
    </form>

    <!-- Sign Up Link - Centered -->
    <div class="signup-section">
      <span class="signup-text">¿No tienes cuenta? </span>
      <ion-button 
        fill="clear" 
        size="small"
        class="signup-link"
        routerLink="/register">
        Crea una ahora
      </ion-button>
    </div>
  </div>
</ion-content>

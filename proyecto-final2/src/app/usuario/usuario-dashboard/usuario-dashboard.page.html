<ion-header>
  <ion-toolbar>
    <ion-title>Dashboard - Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido, {{user?.nombre}}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Aquí puedes solicitar mantenimiento para tu vehículo</p>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" color="primary" (click)="goToNewRequest()">
    <ion-icon slot="start" name="add-circle"></ion-icon>
    Nueva Solicitud de Mantenimiento
  </ion-button>

  <ion-button expand="block" fill="outline" routerLink="/usuario-mis-solicitudes">
    <ion-icon slot="start" name="list"></ion-icon>
    Mis Solicitudes
  </ion-button>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Mi Perfil</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none">
        <ion-label>
          <strong>Nombre:</strong> {{user?.nombre}} {{user?.apellido}}
        </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>
          <strong>Email:</strong> {{user?.email}}
        </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>
          <strong>Teléfono:</strong> {{user?.telefono}}
        </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>
          <strong>Cédula:</strong> {{user?.cedula}}
        </ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-content>

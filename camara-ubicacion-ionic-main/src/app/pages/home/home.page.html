<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Notas</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/add-note">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let note of notes" [routerLink]="['/note-detail', note.id]">
      <ion-label>
        <h2>{{ note.title }}</h2>
        <p>{{ note.content }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <form (ngSubmit)="onRegister()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input type="text" [(ngModel)]="name" name="name" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" [(ngModel)]="email" name="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Password</ion-label>
      <ion-input type="password" [(ngModel)]="password" name="password" required></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top">Crear cuenta</ion-button>
    <ion-button expand="block" fill="clear" routerLink="/login">Ya tengo cuenta</ion-button>
    <ion-button expand="block" color="tertiary" (click)="onRegisterWithGoogle()">
      <ion-icon slot="start" name="logo-google"></ion-icon>
      Registrar con Google
    </ion-button>
  </form>
</ion-content>
